name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # Home Assistant is needed for the integration layer to type-check.
        run: pip install ruff mypy homeassistant
      - name: Lint
        run: ruff check custom_components/ tests/ tests_ha/ tools/
      - name: Format
        run: ruff format --check custom_components/ tests/ tests_ha/ tools/
      - name: Types
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install homeassistant pytest-homeassistant-custom-component
      - name: Protocol library
        # The Home Assistant plugin installs autouse fixtures that assume a
        # running HA loop, so it is kept out of this run.
        run: >-
          pytest tests -p no:homeassistant
          --cov=balboa --cov-report=term-missing --cov-fail-under=90
      - name: Integration
        run: pytest tests_ha
