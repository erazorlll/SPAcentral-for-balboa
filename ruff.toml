target-version = "py313"
line-length = 90

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
    "RUF001",   # ambiguous unicode in prose comments is intentional
    "ASYNC109", # a timeout argument is the API callers expect from discovery
    "SIM108",   # an if/else is clearer than a ternary for the CRC bit loop
]

[lint.per-file-ignores]
"tests/*" = ["SLF001"]
